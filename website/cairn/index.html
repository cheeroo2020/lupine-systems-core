<title>Cairn — Lupine Operations Training</title>

<style>
/* ───────────────────────────────────────────────────────────
   CAIRN — operations training.
   Hard edges, no translucency, no rounded pills. Dense mono
   data against real geography. Structure is visible: the grid
   rules are drawn, not implied.
   Curriculum order follows the book: P1 Ch1-2 -> P4 Ch1+4.
   ─────────────────────────────────────────────────────────── */
:root{
  --bg:#F4F6F7;
  --panel:#FFFFFF;
  --sunk:#EAEEF0;
  --ink:#0B1418;
  --ink-2:#41525A;
  --ink-3:#7F9199;
  --rule:#C9D4D9;
  --rule-2:#E2E9EC;

  --sea:#DCE6EA;
  --land:#C2D1CE;
  --coast:#8FA6A5;

  --wire:#1F4B7A;
  --flow:#0B6E4F;
  --friction:#B03A16;
  --beam:#00778C;

  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
}
:root[data-theme="dark"],:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box;border-radius:0}

html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:var(--sans);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}

/* ── frame ───────────────────────────────────────────── */
.app{height:100dvh;display:grid;grid-template-rows:34px 1fr 26px}
.bar{display:flex;align-items:center;gap:0;border-bottom:1px solid var(--rule);
  background:var(--panel);font-family:var(--mono);font-size:11px;letter-spacing:.1em;
  text-transform:uppercase}
.bar .cell{padding:0 14px;height:100%;display:flex;align-items:center;
  border-right:1px solid var(--rule-2);white-space:nowrap}
.bar .id{font-weight:700;letter-spacing:.24em}
.bar .mod{color:var(--beam);flex:1;overflow:hidden;text-overflow:ellipsis}
.bar .ct{color:var(--ink-3);border-right:0;margin-left:auto}

.body{display:grid;grid-template-columns:minmax(0,440px) 1fr;min-height:0}
@media(max-width:900px){.body{grid-template-columns:1fr;grid-template-rows:1fr 40%}}

/* ── left: station ───────────────────────────────────── */
.panel{border-right:1px solid var(--rule);background:var(--panel);
  display:flex;flex-direction:column;min-height:0}
.ptop{padding:12px 16px;border-bottom:1px solid var(--rule-2)}
.crumb{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 6px;display:flex;gap:8px}
.crumb b{color:var(--beam);font-weight:400}
h1{font-size:17px;line-height:1.25;margin:0;font-weight:600;letter-spacing:-.01em}
.pscroll{flex:1;overflow-y:auto;padding:14px 16px}
.task{font-size:13.5px;color:var(--ink-2);margin:0 0 14px}
.task b{color:var(--ink);font-weight:600}
.task code{font-family:var(--mono);font-size:12px;background:var(--sunk);padding:1px 4px}

/* rows */
.rows{display:flex;flex-direction:column;border:1px solid var(--rule)}
.row{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;
  padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--rule-2);
  cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%;transition:background .12s}
.row:last-child{border-bottom:0}
.row:hover:not(:disabled){background:var(--sunk)}
.row:disabled{cursor:default}
.row:focus-visible{outline:2px solid var(--beam);outline-offset:-2px}
.row .k{font-family:var(--mono);font-size:10px;color:var(--ink-3);letter-spacing:.08em}
.row .nm{font-size:13px;font-weight:500}
.row .sub{grid-column:2;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);
  letter-spacing:.02em;margin-top:1px}
.row .v{font-family:var(--mono);font-size:11px;color:var(--ink-2);text-align:right;
  font-variant-numeric:tabular-nums;white-space:pre-line;line-height:1.35}
.row.hit{background:#E8F2EE;box-shadow:inset 3px 0 0 var(--flow)}
.row.hit .k{color:var(--flow)}
.row.miss{background:#F7EBE6;box-shadow:inset 3px 0 0 var(--friction)}
.row.miss .k{color:var(--friction)}
.row.sel{background:var(--sunk);box-shadow:inset 3px 0 0 var(--beam)}
.row .ord{font-family:var(--mono);font-size:10px;color:var(--beam)}

/* classify */
.bins{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--rule);
  border:1px solid var(--rule);margin-top:10px}
.bin{background:var(--panel);padding:8px 10px;min-height:74px}
.bin h4{margin:0 0 6px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3);font-weight:400}
.bin.h h4{color:var(--friction)}
.bin.s h4{color:var(--wire)}
.chip{display:block;width:100%;text-align:left;font:inherit;font-size:11.5px;
  padding:4px 6px;margin-bottom:3px;background:var(--sunk);border:1px solid var(--rule-2);
  cursor:pointer}
.chip:hover{border-color:var(--beam)}

/* tune */
.tune{border:1px solid var(--rule)}
.tune .opts{display:grid;grid-template-columns:repeat(4,1fr)}
.tune .opts button{padding:9px 4px;background:var(--panel);border:0;
  border-right:1px solid var(--rule-2);border-bottom:1px solid var(--rule);
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  cursor:pointer;color:var(--ink-2)}
.tune .opts button:last-child{border-right:0}
.tune .opts button:hover{background:var(--sunk)}
.tune .opts button.on{background:var(--ink);color:#fff}
.wg{padding:10px}
.wrow{display:grid;grid-template-columns:66px 1fr 34px;gap:8px;align-items:center;
  font-family:var(--mono);font-size:10.5px;margin-bottom:4px}
.wt{height:9px;background:var(--sunk);position:relative}
.wb{position:absolute;inset:0 100% 0 0;background:var(--wire);transition:right .3s}
.wv{text-align:right;color:var(--ink-2);font-variant-numeric:tabular-nums}

/* verdict */
.vd{margin-top:12px;padding:9px 11px;font-size:12.5px;line-height:1.5;display:none;
  border:1px solid}
.vd.on{display:block}
.vd.ok{border-color:var(--flow);background:#EDF5F2;color:var(--ink)}
.vd.no{border-color:var(--friction);background:#F9EFEB;color:var(--ink)}
.vd .l{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;
  text-transform:uppercase;margin-bottom:4px}
.vd.ok .l{color:var(--flow)}
.vd.no .l{color:var(--friction)}

.pfoot{border-top:1px solid var(--rule);padding:9px 16px;display:flex;
  justify-content:space-between;align-items:center;gap:10px;background:var(--panel)}
.lnk{background:none;border:0;font-family:var(--mono);font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-3);cursor:pointer;padding:4px 0}
.lnk:hover{color:var(--ink-2)}
.next{padding:7px 16px;background:var(--ink);color:#fff;border:0;cursor:pointer;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  visibility:hidden}
.next.on{visibility:visible}
.next:hover{background:var(--beam)}
.submit{padding:7px 16px;background:var(--panel);color:var(--ink);border:1px solid var(--ink);
  cursor:pointer;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;margin-top:10px}
.submit:hover{background:var(--ink);color:#fff}

/* ── right: globe ────────────────────────────────────── */
.view{position:relative;min-height:0;background:var(--bg)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.ov{position:absolute;left:14px;top:12px;font-family:var(--mono);font-size:10px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);pointer-events:none}
.ov b{color:var(--ink-2);font-weight:400}
.modmap{position:absolute;right:14px;top:12px;font-family:var(--mono);font-size:10px;
  pointer-events:none;text-align:right}
.modmap div{padding:1px 0;color:var(--ink-3);letter-spacing:.06em}
.modmap div.now{color:var(--beam)}
.modmap div.done{color:var(--flow)}

/* ── status strip ────────────────────────────────────── */
.strip{display:flex;align-items:center;border-top:1px solid var(--rule);background:var(--panel);
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3)}
.strip .c{padding:0 12px;border-right:1px solid var(--rule-2);height:100%;
  display:flex;align-items:center;font-variant-numeric:tabular-nums}
.strip .c:last-child{border-right:0;margin-left:auto}
.trk{flex:1;height:100%;display:flex;align-items:center;padding:0 12px}
.trkbar{flex:1;height:4px;background:var(--sunk);position:relative}
.trkfill{position:absolute;inset:0 100% 0 0;background:var(--flow);transition:right .4s}

/* done */
.dl{border:1px solid var(--rule);margin-top:10px}
.dr{display:grid;grid-template-columns:34px 1fr auto;gap:8px;padding:5px 9px;
  border-bottom:1px solid var(--rule-2);font-family:var(--mono);font-size:10.5px}
.dr:last-child{border-bottom:0}
.dr .s{color:var(--flow)}
.dr .s.r{color:var(--friction)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">

  <div class="bar">
    <span class="cell id">Cairn</span>
    <span class="cell mod" id="barMod">—</span>

  </div>

  <div class="body">
    <section class="panel">
      <div class="ptop">
        <p class="crumb"><b id="cbMod">—</b><span id="cbSrc">—</span></p>
        <h1 id="cbTitle">—</h1>
      </div>
      <div class="pscroll" id="pane"></div>
      <div class="pfoot">
        <button class="lnk" id="hintBtn">Hint</button>
        <button class="next" id="nextBtn">Next →</button>
      </div>
    </section>

    <section class="view">
      <canvas id="gl"></canvas>
      <div class="ov">AUD → SGD · A$500,000<br><b id="ovArc">—</b></div>
      <div class="modmap" id="modmap"></div>
    </section>
  </div>

  <div class="strip">
    <span class="c" id="sAtt">att 0</span>
    <span class="c" id="sFirst">1st 0</span>
    <div class="trk"><div class="trkbar"><div class="trkfill" id="trk"></div></div></div>
    <span class="c" id="sRot">0.0°</span>
  </div>

</div>

  const s=Math.sin(o),k1=Math.sin((1-t)*o)/s,k2=Math.sin(t*o)/s;
  return [a[0]*k1+b[0]*k2,a[1]*k1+b[1]*k2,a[2]*k1+b[2]*k2];
}
function fit(){DPR=Math.min(devicePixelRatio||1,2);
  const r=cv.parentElement.getBoundingClientRect();W=r.width;H=r.height;
  cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+"px";cv.style.height=H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener("resize",fit);

function paint(){
  const{R,cx,cy}=G();
  ctx.clearRect(0,0,W,H);

  ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.fillStyle="#DCE6EA";ctx.fill();

  ctx.save();ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.clip();

  /* graticule */
  ctx.strokeStyle="rgba(11,20,24,.07)";ctx.lineWidth=1;
  for(let la=-60;la<=60;la+=30){ctx.beginPath();let st=false;
    for(let lo=-180;lo<=180;lo+=4){const p=proj(v3(la,lo));
      if(p.z<0){st=false;continue;} if(!st){ctx.moveTo(p.x,p.y);st=true;}else ctx.lineTo(p.x,p.y);}
    ctx.stroke();}
  for(let lo=-180;lo<180;lo+=30){ctx.beginPath();let st=false;
    for(let la=-90;la<=90;la+=4){const p=proj(v3(la,lo));
      if(p.z<0){st=false;continue;} if(!st){ctx.moveTo(p.x,p.y);st=true;}else ctx.lineTo(p.x,p.y);}
    ctx.stroke();}

  /* land */
  for(const ring of LAND){
    let run=[];
    const flush=()=>{ if(run.length>2){ ctx.beginPath();ctx.moveTo(run[0].x,run[0].y);
        for(let i=1;i<run.length;i++)ctx.lineTo(run[i].x,run[i].y);ctx.closePath();
        ctx.fillStyle="#C2D1CE";ctx.fill();
        ctx.strokeStyle="#8FA6A5";ctx.lineWidth=.8;ctx.stroke(); } run=[]; };
    for(const [lo,la] of ring){ const p=proj(v3(la,lo));
      if(p.z<0.02){flush();continue;} run.push(p); }
    flush();
  }
  ctx.restore();

  /* limb */
  ctx.beginPath();ctx.arc(cx,cy,R,0,7);
  ctx.strokeStyle="rgba(0,119,140,.5)";ctx.lineWidth=1.2;ctx.stroke();

  /* arcs */
  const t=performance.now()/1000;
  arcs.forEach((a,i)=>{
    const va=v3(...CITY[a[0]]), vb=v3(...CITY[a[1]]), hot=i===hotArc;
    ctx.beginPath();let st=false;
    for(let k=0;k<=72;k++){const u=k/72,m=slerp(va,vb,u),L=1+0.19*Math.sin(Math.PI*u);
      const p=proj([m[0]*L,m[1]*L,m[2]*L]);
      if(p.z<-0.25){st=false;continue;} if(!st){ctx.moveTo(p.x,p.y);st=true;}else ctx.lineTo(p.x,p.y);}
    ctx.strokeStyle=TONE[a[2]];ctx.globalAlpha=hot?.95:.3;ctx.lineWidth=hot?2:1;
    ctx.stroke();ctx.globalAlpha=1;
    if(hot){const u=(t*.32)%1,m=slerp(va,vb,u),L=1+0.19*Math.sin(Math.PI*u);
      const p=proj([m[0]*L,m[1]*L,m[2]*L]);
      if(p.z>-0.25){ctx.fillStyle=TONE[a[2]];ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,7);ctx.fill();}}
  });

  /* nodes */
  ctx.font="500 9.5px ui-monospace,Menlo,monospace";
  for(const id in CITY){const p=proj(v3(...CITY[id]));if(p.z<0)continue;
    ctx.fillStyle="rgba(0,119,140,"+(.3+p.z*.55).toFixed(2)+")";
    ctx.beginPath();ctx.arc(p.x,p.y,2.4,0,7);ctx.fill();
    if(p.z>.3){ctx.fillStyle="rgba(11,20,24,.5)";ctx.fillText(id,p.x+6,p.y+3);}}

  rot+=0.045;
  document.getElementById("sRot").textContent=((rot%360).toFixed(1))+"°";
  requestAnimationFrame(paint);
}

  ok:"No money movement, no failure simulation, no persistence, no compliance. Scoring and chain verification are real. Naming the gaps precisely reads as competence; vagueness reads as not knowing your own system."});
add(m9,{t:"The Pareto challenge",type:"pick",
  task:"Someone says: <em>your book claims Pareto frontier selection but the code is a weighted sum.</em> <b>Best answer?</b>",
  opts:[["A","Concede it is not implemented","",""],
        ["B","A weighted-sum maximiser always lands on the frontier; what is missing is explicit dominance filtering and route tiering","","correct",1],
        ["C","Argue the two are equivalent","",""]],
  hint:"Both parts matter — what is sound, and what is genuinely absent.",
  ok:"Selection is mathematically sound: a linear utility maximiser always picks a Pareto-optimal point. What is absent is explicit dominance filtering and the admissible/fallback/eliminated tiering. That answer wins respect; hedging loses it."});

/* ═══ runner ══════════════════════════════════════════ */
let i=0,att=0,first=0,tries=0,res=[];
const pane=document.getElementById("pane");
const nextBtn=document.getElementById("nextBtn"), hintBtn=document.getElementById("hintBtn");

const MODS=[...new Set(S.map(s=>s.mod))];
document.getElementById("modmap").innerHTML=MODS.map((m,k)=>
  `<div data-m="${k}">${m}</div>`).join("");

function chrome(){
  const s=S[i];
  document.getElementById("barMod").textContent=s.mod;
  document.getElementById("barCt").textContent=
    String(i+1).padStart(2,"0")+" / "+S.length;
  document.getElementById("cbMod").textContent=s.mod.split(" · ")[1]||s.mod;
  document.getElementById("cbSrc").textContent=s.src;
  document.getElementById("cbTitle").textContent=s.t;
  document.getElementById("sAtt").textContent="att "+att;
  document.getElementById("sFirst").textContent="1st "+first;
  document.getElementById("trk").style.right=(100-(i/S.length)*100)+"%";
  const mi=MODS.indexOf(s.mod);
  [...document.getElementById("modmap").children].forEach((d,k)=>{
    d.className = k<mi?"done":(k===mi?"now":"");
  });
  hotArc=0;
  const map={0:[["SYD","SIN","flow"]],1:[["SYD","SIN","wire"]],
             3:[["SYD","SIN","flow"],["SYD","HKG","wire"],["SYD","NYC","friction"]],
             4:[["SYD","SIN","flow"],["SIN","FRA","wire"]]};
  arcs=map[s.arc]||map[0];
  document.getElementById("ovArc").textContent=s.src;
}

function vd(kind,label,html){
  return `<div class="vd ${kind} on"><span class="l">${label}</span>${html}</div>`;
}
function done(good,msg){
  att++;tries++;
  if(good){
    if(tries===1)first++;
    res.push({n:i+1,t:S[i].t,tries});
    document.getElementById("vbox").innerHTML=vd("ok","Correct",msg||S[i].ok);
    nextBtn.classList.add("on");
  }else{
    document.getElementById("vbox").innerHTML=vd("no","Try again",msg||"Not that one.");
  }
  chrome();
}

function render(){
  const s=S[i];tries=0;chrome();
  nextBtn.classList.remove("on");
  let body="";

  if(s.type==="pick"||s.type==="multi"){
    body=`<div class="rows" id="rows">${s.opts.map((o,k)=>
      `<button class="row" data-k="${k}" data-c="${o[3]==="correct"?1:0}">
         <span class="k">${o[0]}</span><span class="nm">${o[1]}</span>
         <span class="v">${o[2]||""}</span>
         ${o[2]?`<span class="sub"></span>`:""}
       </button>`).join("")}</div>`;
    if(s.type==="multi") body+=`<button class="submit" id="sub">Submit selection</button>`;
  }
  else if(s.type==="order"){
    body=`<div class="rows" id="rows">${s.items.map((it,k)=>
      `<button class="row" data-k="${k}"><span class="k ord" data-o="${k}"></span>
        <span class="nm">${it}</span><span class="v"></span></button>`).join("")}</div>`;
  }
  else if(s.type==="classify"){
    body=`<div class="rows" id="pool">${s.items.map((it,k)=>
      `<button class="row" data-k="${k}"><span class="k">·</span>
        <span class="nm">${it[0]}</span><span class="v"></span></button>`).join("")}</div>
      <div class="bins"><div class="bin h"><h4>Hard — eliminates</h4><div id="binH"></div></div>
      <div class="bin s"><h4>Soft — penalises</h4><div id="binS"></div></div></div>
      <button class="submit" id="sub">Submit</button>`;
  }
  else if(s.type==="tune"){
    body=`<div class="tune"><div class="opts" id="urg">
      ${["low","normal","high","critical"].map(u=>`<button data-u="${u}">${u}</button>`).join("")}
      </div><div class="wg" id="wg"><p style="font-family:var(--mono);font-size:11px;color:var(--ink-3);margin:0">Select a profile.</p></div></div>`;
  }

  pane.innerHTML=`<p class="task">${s.task}</p>${body}<div id="vbox"></div>`;
  pane.scrollTop=0;
  wire(s);
}

function wire(s){
  if(s.type==="pick"){
    document.getElementById("rows").addEventListener("click",e=>{
      const b=e.target.closest(".row");if(!b||b.disabled)return;
      const ok=b.dataset.c==="1";
      b.classList.add(ok?"hit":"miss");
      if(ok){[...b.parentElement.children].forEach(c=>c.disabled=true);done(true);}
      else done(false,s.hintShown?s.hint:"Not that one. "+(s.hint||""));
    });
  }
  if(s.type==="multi"){
    const rows=document.getElementById("rows");
    rows.addEventListener("click",e=>{
      const b=e.target.closest(".row");if(!b||b.disabled)return;
      b.classList.toggle("sel");
    });
    document.getElementById("sub").addEventListener("click",()=>{
      const all=[...rows.children];
      const want=all.filter(b=>b.dataset.c==="1");
      const got=all.filter(b=>b.classList.contains("sel"));
      const ok=got.length===want.length&&got.every(b=>b.dataset.c==="1");
      if(ok){all.forEach(b=>{b.disabled=true;if(b.dataset.c==="1")b.classList.add("hit");});
        document.getElementById("sub").remove();done(true);}
      else{got.forEach(b=>{if(b.dataset.c!=="1")b.classList.add("miss");});
        setTimeout(()=>all.forEach(b=>b.classList.remove("miss","sel")),700);
        done(false,"Selection is not exact. "+(s.hint||""));}
    });
  }
  if(s.type==="order"){
    const rows=document.getElementById("rows");let seq=[];
    rows.addEventListener("click",e=>{
      const b=e.target.closest(".row");if(!b||b.disabled||b.classList.contains("sel"))return;
      const k=+b.dataset.k;
      if(k===seq.length){
        seq.push(k);b.classList.add("sel");
        b.querySelector(".ord").textContent=seq.length;
        if(seq.length===s.items.length){
          [...rows.children].forEach(c=>{c.disabled=true;c.classList.add("hit");});
          done(true);
        }
      }else{
        b.classList.add("miss");
        setTimeout(()=>{[...rows.children].forEach(c=>{
          c.classList.remove("miss","sel");c.disabled=false;
          c.querySelector(".ord").textContent="";});seq=[];},650);
        done(false,"Out of order — restarting. "+(s.hint||""));
      }
    });
  }
  if(s.type==="classify"){
    const pool=document.getElementById("pool");
    const put={};
    pool.addEventListener("click",e=>{
      const b=e.target.closest(".row");if(!b)return;
      const k=+b.dataset.k, cur=put[k];
      put[k] = cur==="hard" ? "soft" : (cur==="soft" ? undefined : "hard");
      b.classList.toggle("sel",!!put[k]);
      b.querySelector(".v").textContent = put[k] ? put[k].toUpperCase() : "";
    });
    document.getElementById("sub").addEventListener("click",()=>{
      const ok=s.items.every((it,k)=>put[k]===it[1]);
      if(ok){[...pool.children].forEach(c=>{c.disabled=true;c.classList.add("hit");});
        document.getElementById("sub").remove();done(true);}
      else done(false,"Not all correct — click an item to cycle hard → soft → clear. "+(s.hint||""));
    });
  }
  if(s.type==="tune"){
    const urg=document.getElementById("urg"), wg=document.getElementById("wg");
    urg.addEventListener("click",e=>{
      const b=e.target.closest("button[data-u]");if(!b)return;
      [...urg.children].forEach(c=>c.classList.toggle("on",c===b));
      const w=W_PROF[b.dataset.u];
      wg.innerHTML=Object.entries(w).map(([k,v])=>
        `<div class="wrow"><span>${k}</span><span class="wt">
           <span class="wb" style="right:${100-v*100}%;background:${k==="speed"?"var(--beam)":"var(--wire)"}"></span>
         </span><span class="wv">${(v*100).toFixed(0)}%</span></div>`).join("");
      if(w.speed>0.5){[...urg.children].forEach(c=>c.disabled=true);done(true);}
    });
  }
  hintBtn.onclick=()=>{document.getElementById("vbox").innerHTML=vd("no","Hint",s.hint||"—");};
}

nextBtn.onclick=()=>{
  i++;
  if(i>=S.length)return finish();
  render();
};

function finish(){
  document.getElementById("trk").style.right="0%";
  document.getElementById("cbTitle").textContent="Run complete";
  document.getElementById("cbMod").textContent="Summary";
  document.getElementById("cbSrc").textContent=S.length+" stations";
  const clean=res.filter(r=>r.tries===1).length;
  pane.innerHTML=`<p class="task"><b>${clean} of ${S.length}</b> passed first try.
    Anything above one attempt is a located gap, not a vague feeling.</p>
    <div class="dl">${res.filter(r=>r.tries>1).map(r=>
      `<div class="dr"><span>${String(r.n).padStart(2,"0")}</span><span>${r.t}</span>
       <span class="s r">${r.tries}×</span></div>`).join("")||
      '<div class="dr"><span>—</span><span>No retries.</span><span class="s">clean</span></div>'}</div>
    <button class="submit" id="again">Run again</button>`;
  nextBtn.classList.remove("on");
  document.getElementById("again").onclick=()=>{i=0;att=0;first=0;res=[];render();};
}

fit();requestAnimationFrame(paint);render();
</script>
