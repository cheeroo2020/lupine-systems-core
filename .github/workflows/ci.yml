name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    # Skip on daily automated commits — the daily workflow already runs tests
    if: "!startsWith(github.event.head_commit.message, 'daily:')"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/test_aiva.py tests/test_rail.py tests/test_cloked.py -v
        env:
          PYTHONPATH: ${{ github.workspace }}
