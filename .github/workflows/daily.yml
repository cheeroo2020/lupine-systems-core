name: Daily Health Check

# SELF-HEALING: runs every hour, but skips immediately if today's
# results already exist. 24 trigger slots per day means a single firing
# is enough to keep the data fresh — GitHub would have to skip all 24
# to cause a missed day (statistically ~zero).
on:
  schedule:
    - cron: "0 8 * * *"    # 6pm Sydney — primary intended run
    - cron: "0 * * * *"    # every hour — catch-up net
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Check if today already done
        id: check
        run: |
          DATE=$(date -u +%Y-%m-%d)
          # Three conditions must ALL be true to skip:
          #   1. Today's test-results file exists
          #   2. Today's news file exists
          #   3. website/data/health.json is already dated today
          if [ -f "test-results/${DATE}.md" ] && \
             [ -f "daily-news/${DATE}.md" ] && \
             grep -q "\"date\": \"${DATE}\"" website/data/health.json 2>/dev/null; then
            echo "Today (${DATE}) already fully processed — skipping."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Today (${DATE}) missing one or more outputs — running full pipeline."
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Trigger Pages deploy if no commit needed
        if: steps.check.outputs.skip == 'true'
        run: echo "Already fresh — nothing to do."

      - name: Set up Python
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        if: steps.check.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Run deterministic tests
        id: unit_tests
        if: steps.check.outputs.skip != 'true'
        run: |
          set +e
          pytest tests/test_aiva.py tests/test_rail.py tests/test_cloked.py -v -s 2>&1 | tee /tmp/unit_output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Run live FX tests
        id: live_tests
        if: steps.check.outputs.skip != 'true'
        run: |
          set +e
          pytest tests/test_live.py -v -s 2>&1 | tee /tmp/live_output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Write daily results file
        if: steps.check.outputs.skip != 'true'
        run: |
          DATE=$(date -u +%Y-%m-%d)
          UNIT_EXIT=${{ steps.unit_tests.outputs.exit_code }}
          LIVE_EXIT=${{ steps.live_tests.outputs.exit_code }}
          OVERALL=$([ "$UNIT_EXIT" = "0" ] && [ "$LIVE_EXIT" = "0" ] && echo "✅ PASSED" || echo "❌ FAILED")

          UNIT_PASSED=$(grep -c " PASSED" /tmp/unit_output.txt || true)
          UNIT_FAILED=$(grep -c " FAILED" /tmp/unit_output.txt || true)
          LIVE_PASSED=$(grep -c " PASSED" /tmp/live_output.txt || true)
          LIVE_FAILED=$(grep -c " FAILED" /tmp/live_output.txt || true)
          TOTAL_PASSED=$((UNIT_PASSED + LIVE_PASSED))
          TOTAL_FAILED=$((UNIT_FAILED + LIVE_FAILED))

          FX_RATE=$(grep -oP '1 AUD = \K[0-9.]+' /tmp/live_output.txt | head -1 || echo "unavailable")
          FX_DATE=$(grep -oP 'as of \K[0-9-]+' /tmp/live_output.txt | head -1 || echo "unavailable")
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          cat > test-results/${DATE}.md << MDEOF
          # Test Run — ${DATE}

          **Result: ${OVERALL}**
          **Tests: ${TOTAL_PASSED} passed, ${TOTAL_FAILED} failed**
          **Run:** [View on GitHub Actions](${RUN_URL})

          ---

          ## Live Market Data

          | Field | Value |
          |-------|-------|
          | Source | [Frankfurter API](https://www.frankfurter.app) |
          | AUD/SGD Rate | ${FX_RATE} |
          | Rate Date | ${FX_DATE} |
          | 500,000 AUD → SGD | $(python3 -c "r=${FX_RATE}; print(f'{500000*r:,.2f}' if r != 'unavailable' else 'N/A')") |

          ---

          ## Deterministic Tests (${UNIT_PASSED}/${UNIT_PASSED} expected)

          | Test | File | Result |
          |------|------|--------|
          $(grep -E " PASSED| FAILED" /tmp/unit_output.txt | grep "::" | sed 's|tests/||' | awk -F'::' '{
            file=$1; rest=$2;
            test=gensub(/ .*/,"",1,rest);
            result=(index($0,"PASSED") > 0) ? "✅ PASSED" : "❌ FAILED";
            print "| \`" test "\` | " file " | " result " |"
          }')

          ## Live FX Tests (${LIVE_PASSED}/${LIVE_PASSED} expected)

          | Test | File | Result |
          |------|------|--------|
          $(grep -E " PASSED| FAILED" /tmp/live_output.txt | grep "::" | sed 's|tests/||' | awk -F'::' '{
            file=$1; rest=$2;
            test=gensub(/ .*/,"",1,rest);
            result=(index($0,"PASSED") > 0) ? "✅ PASSED" : "❌ FAILED";
            print "| \`" test "\` | " file " | " result " |"
          }')

          ---

          ## Raw Output

          <details>
          <summary>Deterministic tests</summary>

          \`\`\`
          $(cat /tmp/unit_output.txt)
          \`\`\`
          </details>

          <details>
          <summary>Live FX tests</summary>

          \`\`\`
          $(cat /tmp/live_output.txt)
          \`\`\`
          </details>
          MDEOF

          RESULT_BADGE=$([ "$UNIT_EXIT" = "0" ] && [ "$LIVE_EXIT" = "0" ] && echo "✅ PASSED" || echo "❌ FAILED")
          if ! grep -q "\[${DATE}\]" test-results/README.md; then
            echo "| [${DATE}](./${DATE}.md) | ${RESULT_BADGE} | ${TOTAL_PASSED}/14 | 1 AUD = ${FX_RATE} SGD |" >> test-results/README.md
          fi

      - name: Fetch daily news
        if: steps.check.outputs.skip != 'true'
        run: python scripts/fetch_daily_news.py
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Generate website data
        if: steps.check.outputs.skip != 'true'
        run: python scripts/generate_site_data.py
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Commit results, news, and site data
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "cheeroo2020"
          git config user.email "cheeroo2020@users.noreply.github.com"
          git add test-results/ daily-news/ website/data/
          git diff --staged --quiet || git commit -m "daily: $(date -u +%Y-%m-%d)"
          git push
