name: Daily Health Check

on:
  schedule:
    - cron: "0 9 * * *"  # 9am UTC every day
  workflow_dispatch:       # also lets you trigger it manually from GitHub

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        id: tests
        run: pytest tests/test_aiva.py tests/test_rail.py tests/test_cloked.py -v
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Open issue if tests fail
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Daily health check failed — ${date}`,
              body: [
                '## Daily test run failed',
                '',
                `**Date:** ${date}`,
                `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'One or more V0 tests failed. Check the run log above for details.',
                '',
                'Tests covered:',
                '- `test_aiva.py` — routing, scoring, selection',
                '- `test_rail.py` — state machine transitions',
                '- `test_cloked.py` — evidence chain integrity',
              ].join('\n'),
              labels: ['bug'],
            });
